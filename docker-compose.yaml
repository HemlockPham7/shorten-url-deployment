  user-service:
    image: hemlockpham/user-service:latest
    restart: always
    container_name: user-service
    depends_on:
      - redis
      - postgres
    ports:
      - "8082:8080"
    env_file:
      - ./user-service/.env
    volumes:
      - ./public.pem:/app/public.pem
      - ./private.pem:/app/private.pem

