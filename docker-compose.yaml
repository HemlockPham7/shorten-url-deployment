version: '3.7'

services:
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:17
    container_name: postgres
    ports:
      - "5432:5432"
    env_file:
      - ./postgres/.env
    volumes:
      - ./postgres/init-db:/docker-entrypoint-initdb.d
      - ./postgres_data:/var/lib/postgresql/data:Z

